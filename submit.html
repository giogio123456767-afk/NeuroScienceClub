<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit a Paper</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<h1>Submit <b>research</b></h1>
<p class="sub">Your paper goes to admin review first. Once approved, it appears in the gallery.</p>
<form id="f" class="glass">
<label>Place of study (school / college) <em>*</em><input name="school" required maxlength="150"></label>
<label>Main author <em>*</em><input name="author" required maxlength="120"></label>
<label>Co-authors (optional)<input name="coauthors" maxlength="300" placeholder="Comma-separated"></label>
<label>Author email (optional)<input name="email" type="email" maxlength="150"></label>
<label>Research paper title <em>*</em><input name="title" required maxlength="250"></label>
<label>Upload your paper <em>*</em><input name="file" type="file" accept=".pdf,.doc,.docx">
<small>In Google Docs: File → Download → PDF (best, keeps images) or .docx. Max 20 MB.</small></label>
<label>…or paste a Google Doc link (optional)<input name="link" type="url" placeholder="https://docs.google.com/… (set sharing to “Anyone with the link”)"></label>
<input class="hp" name="website" tabindex="-1" autocomplete="off">
<div id="m" class="msg"></div>
<button class="p" id="b">Submit for review</button>
</form></main>
<script src="/app.js"></script>
<script>
const f=document.getElementById("f"),m=document.getElementById("m"),b=document.getElementById("b");
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.className="msg";
try{const r=await fetch("/api/submit",{method:"POST",body:new FormData(f)});const d=await r.json();
if(!r.ok)throw new Error(d.error||"Something went wrong");
f.reset();m.className="msg ok";m.textContent="Thanks! Your paper is awaiting admin review."}
catch(x){m.className="msg er";m.textContent=x.message}b.disabled=false};
</script></body></html>
