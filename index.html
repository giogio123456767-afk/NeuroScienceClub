<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Gallery</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<h1>Student <b>Neuroscience</b><br>Research Gallery</h1>
<p class="sub">Peer-shared papers from students everywhere. Every submission is reviewed by our officers before it appears here.</p>
<input id="q" class="search glass" placeholder="Search title, author, or school…" type="search">
<div id="g" class="grid"></div>
<p style="margin-top:28px"><a class="btn p" href="/submit.html">Submit your paper</a></p>
</main><footer>Reviewed by club officers</footer>
<script src="/app.js"></script>
<script>
let all=[];const g=document.getElementById("g");
function draw(){const q=document.getElementById("q").value.toLowerCase();
const r=all.filter(p=>[p.title,p.author,p.coauthors,p.school].join(" ").toLowerCase().includes(q));
g.innerHTML=r.length?r.map(p=>`<article class="card glass"><span class="tag ok">${esc(p.school)}</span><h3>${esc(p.title)}</h3>
<div class="m">${esc(p.author)}${p.coauthors?" · "+esc(p.coauthors):""}</div>
<div class="acts">${p.file_name?`<a class="btn p" href="/api/file/${p.id}" target="_blank" rel="noopener">Read paper</a>`:""}${p.link?`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">Google Doc</a>`:""}</div></article>`).join(""):`<div class="empty glass" style="grid-column:1/-1">No papers yet.</div>`}
fetch("/api/papers").then(r=>r.json()).then(d=>{all=d;draw()}).catch(()=>g.innerHTML='<div class="empty glass" style="grid-column:1/-1">Could not load papers.</div>');
document.getElementById("q").oninput=draw;
</script></body></html>
